name: Release

# 推送版本标签（v1.0.0 之类）即发布：构建并把 exe 作为 Release 附件上传。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write        # 创建 / 更新 Release 需要写权限

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build
        shell: cmd
        run: |
          set "PATH=C:\msys64\mingw64\bin;%PATH%"
          src\build.bat

      # 附件名带上标签，便于同机并存多个版本
      - name: Prepare asset
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item release/hwbattery.exe "dist/hwbattery-$tag.exe"
          Get-ChildItem dist | Format-Table Name, Length

      # 用 runner 预装的 gh CLI，不引入第三方 action
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" (Get-ChildItem dist/*.exe).FullName `
            --title "$tag" --generate-notes
